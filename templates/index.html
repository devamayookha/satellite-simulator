<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Constellation Simulator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <!-- Left Sidebar for Controls and Stats -->
        <div class="sidebar">
            <h2>Constellation Config</h2>
            
            <label>Number of Satellites:</label>
            <input type="number" id="numSats" value="12" min="1" max="100">
            
            <label>Number of Planes:</label>
            <input type="number" id="numPlanes" value="3" min="1" max="20">
            
            <label>Altitude (km):</label>
            <input type="number" id="altitude" value="550" min="100" max="36000">
            
            <label>Inclination (deg):</label>
            <input type="number" id="inclination" value="53" min="0" max="180">
            
            <label>Coverage Radius (km):</label>
            <input type="number" id="coverageRadius" value="1000" min="100" max="5000">
            
            <button id="updateBtn">Update Simulation</button>

            <hr>
            
            <h3>Simulation Controls</h3>
            <button id="playPauseBtn">Pause</button>
            
            <label>Sim Speed (x):</label>
            <input type="range" id="simSpeed" min="1" max="50" value="10">
            <span id="speedValue" style="font-size: 12px; color: var(--text-muted); display: block; text-align: right; margin-top: 4px;">10x</span>

            <hr>
            
            <h3>Live Stats</h3>
            <p>Current Coverage: <span id="coverageStat" style="font-weight: bold;">0%</span></p>
            <p>Max Coverage: <span id="maxCoverageStat" style="font-weight: bold;">0%</span></p>
            <p>Sim Time: <span id="timeStat">0h 0m</span></p>
        </div>

        <!-- Main Area for the Map -->
        <div class="main-view">
            <h2>Earth Coverage Map</h2>
            
            <!-- Increased canvas size to fill more screen space -->
            <canvas id="mapCanvas" width="1000" height="500"></canvas>
            
            <!-- Added a Legend Box to fill vertical space and look professional -->
            <div class="legend-box">
                <div class="legend-item"><span class="dot covered"></span> Covered Area</div>
                <div class="legend-item"><span class="dot gap"></span> Coverage Gap</div>
                <div class="legend-item"><span class="dot satellite"></span> Satellite Position</div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
